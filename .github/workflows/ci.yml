name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast, dependency-free guard: every declaration of the project's version has
  # to agree. On a release branch or tag (release/vX.Y.Z or vX.Y.Z) the name
  # itself is included, so a release branch can never ship a different version
  # than it claims.
  version:
    name: Version Symmetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version symmetry
        run: ./scripts/check-release-version.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run security audit
        run: cargo audit

      - name: Run license and dependency checks
        run: cargo deny check

  test-native:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      # `axum-transport` is not a default feature, so the mountable-router
      # tests would otherwise never run.
      - name: Run library embedding tests (axum-transport)
        run: cargo test -p latticedb-server --features axum-transport

  test-wasm:
    name: Test (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run WASM tests
        run: wasm-pack test --headless --chrome crates/lattice-core

  test-js:
    name: Test (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM
        run: |
          wasm-pack build crates/lattice-server \
            --target web \
            --out-dir ../../packages/lattice-db-js/wasm \
            --no-default-features \
            --features wasm

      - name: Install dependencies
        working-directory: packages/lattice-db-js
        run: npm install

      - name: Run TypeScript tests
        working-directory: packages/lattice-db-js
        run: npm test

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace

      - name: Check WASM target (core)
        run: cargo check -p latticedb-core --target wasm32-unknown-unknown

      - name: Check WASM target (server)
        run: cargo check -p latticedb-server --target wasm32-unknown-unknown --no-default-features --features wasm

      # Ensures the embeddable Axum router keeps compiling for library users
      - name: Check library embedding feature (axum-transport)
        run: cargo clippy -p latticedb-server --features axum-transport --all-targets -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      # Use the llvm engine (avoids ptrace instrumentation false-positives on
      # deterministic in-memory tests) and a generous timeout. The lattice-bench
      # crate holds long-running ACID stress tests that are not meaningful for
      # coverage and blow past tarpaulin's per-test timeout, so exclude it.
      - name: Generate coverage
        run: cargo tarpaulin --workspace --exclude lattice-bench --engine llvm --timeout 300 --out Xml --skip-clean

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: cobertura.xml
          fail_ci_if_error: false

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Download baseline (if exists)
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: benchmark-baseline-${{ runner.os }}
          restore-keys: |
            benchmark-baseline-${{ runner.os }}

      - name: Run CI benchmarks
        run: cargo bench -p lattice-bench -- ci_

      - name: Save baseline (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: benchmark-baseline-${{ runner.os }}-${{ github.sha }}
