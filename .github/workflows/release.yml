name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  # Lets the registry publishes be retried against the version already in the
  # tree, without inventing a new tag just to re-run a failed publish.
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish the current version to npm'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wasm-js:
    name: Build WASM & JS Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM package
        run: |
          wasm-pack build crates/lattice-server \
            --target web \
            --out-dir ../../packages/lattice-db-js/wasm \
            --no-default-features \
            --features wasm

      # wasm-pack writes a catch-all .gitignore into the out-dir, which would
      # exclude the wasm/ contents from the published npm tarball.
      - name: Drop generated wasm .gitignore
        run: rm -f packages/lattice-db-js/wasm/.gitignore

      - name: Install npm dependencies
        working-directory: packages/lattice-db-js
        run: npm install

      - name: Build TypeScript bundle
        working-directory: packages/lattice-db-js
        run: |
          npm run build:types
          npm run build:esm
          npm run build:cjs
          npm run build:minify

      - name: Copy README
        run: cp README.md packages/lattice-db-js/

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/lattice-db-js
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Upload raw JS files for GitHub Release (individual files)
      - name: Upload JS bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            packages/lattice-db-js/dist/lattice-db.js
            packages/lattice-db-js/dist/lattice-db.esm.js
            packages/lattice-db-js/dist/lattice-db.min.js
            packages/lattice-db-js/wasm/lattice_server.js
            packages/lattice-db-js/wasm/lattice_server_bg.wasm

      # Upload full npm package for publishing
      - name: Upload npm package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: packages/lattice-db-js/

      # wasm32-unknown-unknown build, packaged for external static referencing.
      # Emits versioned + stable tarball names plus a checksum file, mirroring
      # the native binaries.
      - name: Package WASM
        run: |
          set -euo pipefail
          VERSIONED="lattice-db-wasm-${{ github.ref_name }}.tar.gz"
          STABLE="lattice-db-wasm.tar.gz"
          tar -czvf "$VERSIONED" -C packages/lattice-db-js/wasm .
          cp "$VERSIONED" "$STABLE"
          shasum -a 256 "$VERSIONED" "$STABLE" \
            packages/lattice-db-js/wasm/lattice_server.js \
            packages/lattice-db-js/wasm/lattice_server_bg.wasm \
            > lattice-db-wasm.sha256
          cat lattice-db-wasm.sha256

      - name: Upload WASM tarball
        uses: actions/upload-artifact@v7
        with:
          name: wasm-package
          path: |
            lattice-db-wasm*.tar.gz
            lattice-db-wasm.sha256

  build-docs:
    name: Build Documentation
    needs: build-wasm-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install mdbook
        run: cargo install mdbook

      - name: Build API docs
        run: cargo doc --workspace --no-deps

      - name: Build book
        run: mdbook build book

      - name: Download JS bundle
        uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: js-bundle

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build RAG example
        working-directory: examples/rag-example
        run: |
          npm install
          npm run build
        env:
          GITHUB_ACTIONS: true

      - name: Prepare pages
        run: |
          mkdir -p pages/js pages/wasm pages/chat
          cp -r target/doc pages/api
          cp -r target/book pages/book
          # Copy JS bundle to pages for CDN-style access
          # Structure: /js/lattice-db.min.js imports ../wasm/lattice_server.js
          cp js-bundle/dist/*.js pages/js/
          cp js-bundle/wasm/lattice_server.js pages/wasm/
          cp js-bundle/wasm/lattice_server_bg.wasm pages/wasm/
          # Copy RAG example to /chat/
          cp -r examples/rag-example/dist/* pages/chat/
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=book/"></head></html>' > pages/index.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  build-native:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p latticedb-server --target ${{ matrix.target }}

      # Each platform publishes four directly-downloadable assets plus a
      # checksum file, so consumers can either extract an archive or link
      # straight at the executable:
      #   lattice-db-<platform>-<tag>.tar.gz  archive, pinned to one release
      #   lattice-db-<platform>.tar.gz        archive, stable name
      #   lattice-server-<platform>-<tag>     raw binary, pinned
      #   lattice-server-<platform>           raw binary, stable name
      # Stable names resolve via /releases/latest/download/<name>.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/lattice-server"
          ARCHIVE_VERSIONED="lattice-db-${{ matrix.name }}-${{ github.ref_name }}.tar.gz"
          ARCHIVE_STABLE="lattice-db-${{ matrix.name }}.tar.gz"
          BIN_VERSIONED="lattice-server-${{ matrix.name }}-${{ github.ref_name }}"
          BIN_STABLE="lattice-server-${{ matrix.name }}"

          tar -czvf "$ARCHIVE_VERSIONED" -C "$(dirname "$BIN")" lattice-server
          cp "$ARCHIVE_VERSIONED" "$ARCHIVE_STABLE"

          # Raw, uncompressed executables for direct hyperlinking
          cp "$BIN" "$BIN_VERSIONED"
          cp "$BIN" "$BIN_STABLE"
          chmod +x "$BIN_VERSIONED" "$BIN_STABLE"

          shasum -a 256 "$ARCHIVE_VERSIONED" "$ARCHIVE_STABLE" \
            "$BIN_VERSIONED" "$BIN_STABLE" > "lattice-db-${{ matrix.name }}.sha256"
          cat "lattice-db-${{ matrix.name }}.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Bin = "target/${{ matrix.target }}/release/lattice-server.exe"
          $ArchiveVersioned = "lattice-db-${{ matrix.name }}-${{ github.ref_name }}.zip"
          $ArchiveStable = "lattice-db-${{ matrix.name }}.zip"
          $BinVersioned = "lattice-server-${{ matrix.name }}-${{ github.ref_name }}.exe"
          $BinStable = "lattice-server-${{ matrix.name }}.exe"

          Compress-Archive -Path $Bin -DestinationPath $ArchiveVersioned
          Copy-Item $ArchiveVersioned $ArchiveStable

          # Raw executables for direct hyperlinking
          Copy-Item $Bin $BinVersioned
          Copy-Item $Bin $BinStable

          Get-FileHash $ArchiveVersioned, $ArchiveStable, $BinVersioned, $BinStable -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding ascii "lattice-db-${{ matrix.name }}.sha256"
          Get-Content "lattice-db-${{ matrix.name }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            lattice-db-${{ matrix.name }}*.tar.gz
            lattice-db-${{ matrix.name }}*.zip
            lattice-db-${{ matrix.name }}.sha256
            lattice-server-${{ matrix.name }}*

  deploy-pages:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-npm:
    name: Publish to NPM
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
    needs: build-wasm-js
    runs-on: ubuntu-latest
    # Publishes via npm trusted publishing (OIDC) — no long-lived token.
    # `id-token: write` lets the runner mint the short-lived OIDC token that
    # npm exchanges for publish rights.
    #
    # The trusted publisher on npmjs.com must match this job exactly:
    #   workflow filename -> release.yml
    #   repository        -> Avarok-Cybersecurity/lattice-db
    #   environment       -> npm-js (below)
    # The environment name is part of the OIDC token's claims, so if npm has
    # one configured the job must run in it or the publish is rejected.
    environment: npm-js
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Trusted publishing requires Node >= 22.14.0
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Recommended when publishing: a poisoned package cache could
          # otherwise expose credentials, including the OIDC token.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node is
      # usually older, so upgrade before publishing.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # npm only validates a trusted-publisher configuration at publish time,
      # so if publishing fails this shows whether OIDC was even available to
      # the CLI (versus the config on npmjs.com not matching this workflow).
      - name: Report OIDC context
        run: |
          # e.g. owner/repo/.github/workflows/release.yml@refs/tags/v0.3.2
          # Drop the git ref first, then take the basename.
          REF="${GITHUB_WORKFLOW_REF%%@*}"
          echo "workflow file : ${REF##*/}"
          echo "repository    : ${GITHUB_REPOSITORY}"
          # Actions exposes no variable for the job's environment, so this is
          # printed literally — keep it in sync with `environment:` above.
          echo "environment   : npm-js"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token    : available to this job"
          else
            echo "OIDC token    : MISSING (id-token: write not in effect)"
          fi

      # No NODE_AUTH_TOKEN: npm detects the OIDC environment and authenticates
      # with it, and provenance attestations are generated automatically.
      # --ignore-scripts skips the package's prepublishOnly hook, which would
      # re-run `wasm-pack build` — impossible here (no Rust toolchain) and
      # redundant, since this job publishes the artifact built upstream.
      - name: Publish to npm
        working-directory: package
        run: npm publish --ignore-scripts --access public

  publish-crates:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish lattice-core
        run: cargo publish -p latticedb-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true  # May already be published

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish lattice-storage
        run: cargo publish -p latticedb-storage --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish lattice-server
        run: cargo publish -p latticedb-server --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-docs, build-wasm-js, build-native]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
            artifacts/**/lattice-server-*
            artifacts/js-bundle/dist/lattice-db.js
            artifacts/js-bundle/dist/lattice-db.esm.js
            artifacts/js-bundle/dist/lattice-db.min.js
            artifacts/js-bundle/wasm/lattice_server.js
            artifacts/js-bundle/wasm/lattice_server_bg.wasm
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
